<rect x="64" y="456" width="368" height="150" rx="16" fill="#ffffff" stroke="#dce3ef" stroke-width="1.5"/>
<text x="86" y="488" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172554" font-weight="700">COMPLIANCE &amp; PLANNING</text>
<text x="86" y="521" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" font-weight="400">Versioned rules and source metadata</text>
<text x="86" y="549" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" font-weight="400">Deadline / completion assessments</text>
<text x="86" y="577" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" font-weight="400">Exact preparation scheduling</text>
