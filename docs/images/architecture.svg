<rect x="64" y="732" width="552" height="144" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="88" y="765" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#065f46" font-weight="700">PRODUCTION · Neon PostgreSQL</text>
<text x="88" y="797" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" font-weight="400">Accounts, membership and workspace aggregates</text>
<text x="88" y="824" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" font-weight="400">Encrypted FinancialLedger + encrypted EvidenceFile</text>
<text x="88" y="852" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#065f46" font-weight="400">Persistent storage; no business SQLite on Vercel.</text>
<rect x="648" y="732" width="280" height="144" rx="16" fill="#ffffff" stroke="#dce3ef" stroke-width="1.5"/>
<text x="670" y="765" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172554" font-weight="700">LOCAL DEVELOPMENT</text>
<text x="670" y="798" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" font-weight="400">SQLite business adapter</text>
<text x="670" y="826" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" font-weight="400">Private local evidence</text>
<text x="670" y="854" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b" font-weight="400">Existing records retained</text>
<rect x="960" y="732" width="296" height="144" rx="16" fill="#ffffff" stroke="#dce3ef" stroke-width="1.5"/>
<text x="982" y="765" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172554" font-weight="700">PUBLIC LEGAL SEARCH</text>
<text x="982" y="798" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" font-weight="400">Reviewed sources + FTS5</text>
<text x="982" y="826" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" font-weight="400">In memory on Vercel</text>
<text x="982" y="854" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b" font-weight="400">Separate rebuildable index</text>
<text x="64" y="920" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4f46e5" font-weight="700">BOUNDARIES</text>
<text x="194" y="920" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" font-weight="400">Forecast ≠ statutory turnover  ·  Evidence ≠ legal acceptance  ·  Live AI failure ≠ hidden local fallback</text>
<text x="64" y="950" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b" font-weight="400">Arrows describe responsibility and data flow; the public legal index is not a private business database.</text>
