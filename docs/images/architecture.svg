<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="984" viewBox="0 0 1320 984" role="img" aria-labelledby="title desc">
<title id="title">ComplianceCopilot architecture — Team R²PS</title>
<desc id="desc">A browser connects to a Next.js authenticated API. Deterministic compliance and finance engines and read-only AI tools operate behind server-side authorization. Production data persists in Neon PostgreSQL, local development retains SQLite, and public legal search uses a separate rebuildable index.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<rect width="1320" height="984" rx="24" fill="#f5f7fc"/>
<text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#172554" font-weight="700">ComplianceCopilot</text>
<text x="64" y="99" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4f46e5" font-weight="600">System architecture · Team R²PS</text>
<text x="64" y="129" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" font-weight="400">One full-stack application. Deterministic decisions, contextual explanations and persistent business records.</text>
<rect x="64" y="158" width="1192" height="98" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="88" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#312e81" font-weight="700">BROWSER · React dashboard</text>
<text x="88" y="221" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" font-weight="400">Business overview  /  Laws  /  Tasks &amp; deadlines  /  Risks  /  Growth planner  /  Ask Copilot</text>
<path d="M660 256 V292" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="236" y="296" width="848" height="104" rx="16" fill="#ffffff" stroke="#dce3ef" stroke-width="1.5"/>
<text x="260" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172554" font-weight="700">NEXT.JS APP ROUTER · Server API boundary</text>
<text x="260" y="362" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" font-weight="400">NextAuth session → workspace membership → validation → authorized operation</text>
<text x="260" y="385" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b" font-weight="400">Frontend and backend are served by the same deployment.</text>
