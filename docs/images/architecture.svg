<text x="498" y="549" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" font-weight="400">Integer-paise cash-flow calculations</text>
<text x="498" y="577" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" font-weight="400">Provisional forecasts and warnings</text>
