<text x="910" y="549" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" font-weight="400">Gemini · optional OpenRouter</text>
<text x="910" y="577" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" font-weight="400">Explains results; cannot save facts</text>
